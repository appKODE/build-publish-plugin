name: Publish Plugin to Portal

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    environment: release
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/
          key: cache-gradle-cache
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/
          key: cache-gradle-wrapper
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Publish on Plugin Portal
        run: ./gradlew --project-dir plugin-build setupPluginUploadFromEnvironment publishPlugins
        if: success()
      # Release notes are the tag's section of CHANGELOG.md: tag `novo-X.Y.Z` -> first "### X.Y.Z"
      # heading, which is the build-publish-novo one (the core and legacy sections come after it).
      # Relative links (docs/..., MIGRATION.md) are pinned to the tag so they resolve from the release page.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="### ${GITHUB_REF_NAME#novo-}" \
            'f && /^(### |## |---)/ { exit } $0 == h { f = 1; next } f' CHANGELOG.md \
            | sed -E "s#\]\(((docs/|[A-Za-z_-]+\.md)[^)]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Stop Gradle
        run: ./gradlew --stop
